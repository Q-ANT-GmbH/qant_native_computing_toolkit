<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q.ANT Native Computing Toolkit — Documentation</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --fg: #1c2024;
      --muted: #5b6470;
      --border: #e2e6ea;
      --accent: #4f46e5;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a20;
        --fg: #e7eaee;
        --muted: #9aa4b2;
        --border: #262b33;
        --accent: #7c73ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header { text-align: center; max-width: 40rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 0.5rem; }
    header p { color: var(--muted); font-size: 1.05rem; margin: 0; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 46rem;
    }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }
    a.card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    a.card h2 { margin: 0 0 0.4rem; font-size: 1.25rem; }
    a.card p { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; }
    .go { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
    footer { color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>API reference for Q-ANT Native Computing Toolkit</h1>
    <p>Pick the interface you're working with.</p>
  </header>

  <main class="cards">
    <a class="card" href="./c/">
      <h2>C API</h2>
      <p>Reference for the C shared library.</p>
      <span class="go">Open C docs &rarr;</span>
    </a>
    <a class="card" href="./python/">
      <h2>Python API</h2>
      <p>Reference for the Python package.</p>
      <span class="go">Open Python docs &rarr;</span>
    </a>
  </main>

  <footer>
    Source on <a href="https://github.com/Q-ANT-GmbH/qant_native_computing_toolkit">GitHub</a>.
  </footer>
</body>
</html>
