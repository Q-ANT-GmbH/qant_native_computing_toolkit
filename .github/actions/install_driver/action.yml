name: "Install qant native computing driver"
description: "Downloads a simulated driver .deb from a driver repo (release asset or dev workflow artifact) and installs it. Generic over 'repo', so it can install qant_native_computing_driver or qant_native_computing_driver_gen2plus by passing a different repo/output-dir."

inputs:
  os:
    description: "OS name (e.g. ubuntu:24.04)"
    required: true
  source:
    description: "Where to fetch the driver from: 'release' (GitHub (pre)release asset) or 'artifact' (dev workflow artifact)"
    required: true
  version:
    description: "Release tag to install when source=release (e.g. v2.2.0)."
    required: false
    default: "v2.2.0"
  run-id:
    description: "Workflow run id in the driver repo to pull from when source=artifact"
    required: false
    default: "28852863399"
  token:
    description: "Token for the driver repo: contents:read for releases and/or actions:read for artifacts"
    required: true
  repo:
    description: "repo that builds the driver .deb"
    required: false
    default: "Q-ANT-GmbH/qant_native_computing_driver"
  output-dir:
    description: "Where to download/extract the driver package to. Use a distinct dir per driver if installing more than one in the same job."
    required: false
    default: "driver_pkg"
  artifact-name:
    description: "Dev workflow artifact name to pull from when source=artifact. Differs per driver repo."
    required: false
    default: "qant-native-computing-driver-packages-simulated"
  generation:
    description: "Driver generation ('gen2' or 'gen2plus'). Selects which dep/configs/ device configs are installed and where."
    required: false
    default: "gen2"

runs:
  using: "composite"
  steps:
    - name: os without colons
      id: os_name
      shell: bash
      run: echo "OS_NAME_WO_COLON=$(echo '${{ inputs.os }}' | sed 's/:/_/g')" >> "$GITHUB_OUTPUT"

    # source=release: install the tooling needed to pull the release bundle.
    # gh is not in the distro repos, so install it from GitHub's official apt repo.
    - name: install gh CLI and unzip
      if: ${{ inputs.source == 'release' }}
      shell: bash
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y unzip
        if ! command -v gh >/dev/null 2>&1; then
          apt-get install -y curl ca-certificates
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get install -y gh
        fi

    # source=release: pull the simulated release bundle with the official gh CLI.
    # Asset name mirrors the driver repo's publish-release workflow:
    #   gen2:     qant-native-computing-driver-simulated-<tag>.zip          ->  <os>/qant*.deb
    #   gen2plus: qant-native-computing-driver-gen2plus-simulated-<tag>.zip ->  <os>/qant*.deb
    - name: download simulated release bundle
      if: ${{ inputs.source == 'release' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        VERSION: ${{ inputs.version }}
        GENERATION: ${{ inputs.generation }}
      run: |
        set -euo pipefail
        case "$GENERATION" in
          gen2)     BUNDLE="qant-native-computing-driver-simulated-${VERSION}.zip" ;;
          gen2plus) BUNDLE="qant-native-computing-driver-gen2plus-simulated-${VERSION}.zip" ;;
          *) echo "Unknown generation '$GENERATION' (expected gen2 or gen2plus)" >&2; exit 1 ;;
        esac
        # Explicit tag downloads the pre-release regardless of "Latest" status.
        gh release download "$VERSION" --repo "$REPO" --pattern "$BUNDLE" --dir . --clobber
        mkdir -p "${{ inputs.output-dir }}"
        unzip -o "$BUNDLE" -d "${{ inputs.output-dir }}"

    # source=artifact: pull the simulated dev workflow artifact (beware: can expire on driver side)
    # Same nested layout as the release bundle: <os>/qant*.deb
    - name: download simulated dev artifact
      if: ${{ inputs.source == 'artifact' }}
      uses: actions/download-artifact@v7
      with:
        github-token: ${{ inputs.token }}
        repository: ${{ inputs.repo }}
        run-id: ${{ inputs.run-id }}
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}

    - name: install driver
      shell: bash
      # Both sources unpack to <os>/qant*.deb.
      run: apt install -y ./${{ inputs.output-dir }}/${{ steps.os_name.outputs.OS_NAME_WO_COLON }}/qant*.deb

    - name: install device configs (simulated npus)
      shell: bash
      # The driver is looking for the npu device configs in
      #   gen2:     /etc/qant-native-computing-driver/          (dep/configs/device_config_ng2_*)
      #   gen2plus: /etc/qant-native-computing-driver-gen2plus/ (dep/configs/device_config_ng2p_*)
      # We install three dummy configs for the CI tests
      run: |
        set -euo pipefail
        case "${{ inputs.generation }}" in
          gen2)     PREFIX="device_config_ng2_";  CONFIG_DIR="/etc/qant-native-computing-driver" ;;
          gen2plus) PREFIX="device_config_ng2p_"; CONFIG_DIR="/etc/qant-native-computing-driver-gen2plus" ;;
          *) echo "Unknown generation '${{ inputs.generation }}' (expected gen2 or gen2plus)" >&2; exit 1 ;;
        esac
        mkdir -p "$CONFIG_DIR/"
        cp dep/configs/${PREFIX}* "$CONFIG_DIR/"
