name: "Setup apt"
description: "Increases number of retries and timeouts for apt"

runs:
  using: "composite"
  steps:
  - name: make apt more resistant
    shell: bash
    run: |
        echo 'Acquire::Retries "5"; 
        Acquire::http::Timeout "60";
        Acquire::https::Timeout "60";' \
        | tee /etc/apt/apt.conf.d/99-retry-timeout.conf
