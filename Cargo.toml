[package]
name = "qant_native_computing_toolkit"
version = "2.3.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Official API for running workloads on Q.ANT native processing units"
repository = "https://github.com/Q-ANT-GmbH/qant_native_computing_toolkit"

[lib]
name = "qant_native_computing_toolkit"
# cdylib needed for python bridge
crate-type = ["rlib", "cdylib"]

[profile.release-with-debug]
inherits = "release"
debug = true

[features]
default = ["python-bridge"]
python-bridge = ["pyo3", "numpy", "ndarray"]
cpu-backend = []

[build-dependencies]
bindgen = "0.72.1"

[dependencies]
libc = "0.2.180"
once_cell = "1.21.3"
rayon = "1.11.0"
pyo3 = {version = "0.27.0", optional = true}
ndarray = {version = "0.17.2", optional = true}
numpy = {version = "0.27.1", optional = true, features=["half"]}
tracing = "0.1.44"
rand = "0.9.2"
num-traits = "0.2.19"
half = { version = "2.7.1", features = ["bytemuck", "num-traits"] }
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
mem_forget = "deny"
