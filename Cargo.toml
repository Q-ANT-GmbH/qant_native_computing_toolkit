[package]
name = "qant_native_computing_toolkit"
version = "2.4.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Official API for running workloads on Q.ANT native processing units"
repository = "https://github.com/Q-ANT-GmbH/qant_native_computing_toolkit"

[lib]
name = "qant_native_computing_toolkit"
# cdylib needed for python bridge
crate-type = ["rlib", "cdylib"]

[profile.release-with-debug]
inherits = "release"
debug = true

[features]
default = ["python-bridge"]
python-bridge = ["pyo3", "numpy"]
cpu-backend = []

[build-dependencies]
bindgen = "0.73.2"

[dependencies]
rayon = "1.12.0"
pyo3 = {version = "0.29.3", optional = true, features = ["abi3-py311"]}
numpy = {version = "0.29.0", optional = true, features=["half"]}
tracing = "0.1.44"
num-traits = "0.2.19"
half = { version = "2.7.1", features = ["num-traits"] }

[dev-dependencies]
rand = "0.10.3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
mem_forget = "deny"
